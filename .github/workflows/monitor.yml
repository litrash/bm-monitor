name: 统一招聘监控

on:
  schedule:
    # 每天北京时间 9:00 和 21:00 推送日报 (UTC: 1:00, 13:00)
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行统一监控
        env:
          CI: 'true'
          BM_PROXY: ${{ secrets.BM_PROXY }}
          BM_SC_SENDKEY: ${{ secrets.BM_SC_SENDKEY }}
          BM_TG_BOT_TOKEN: ${{ secrets.BM_TG_BOT_TOKEN }}
          BM_TG_CHAT_ID: ${{ secrets.BM_TG_CHAT_ID }}
          BM_KEYWORDS: ${{ secrets.BM_KEYWORDS }}
          BM_AREAS: ${{ secrets.BM_AREAS }}
          BM_ENDING_HOURS: ${{ secrets.BM_ENDING_HOURS }}
          ZJ_PAGES: '3'
          ZJ_AREAID: '23'
        run: python unified_monitor.py

      - name: 提交状态更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch bm_monitor_state.json zj_monitor_state.json
          git add bm_monitor_state.json zj_monitor_state.json
          if git diff --cached --quiet; then
            echo "状态无变化, 跳过提交"
          else
            git commit -m "chore: 更新监控状态 [skip ci]"
            git push
          fi